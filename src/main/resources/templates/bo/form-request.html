<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>설문 변환 요청</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="/bo/scripts/navigation.js"></script>
    <script src="/bo/scripts/toast.js"></script>
    <script src="/bo/scripts/api-call.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" th:href="@{/bo/styles/common.css}">
</head>
<body class="bg-slate-100 h-screen overflow-y-auto p-6">

<div class="space-y-6 pb-6">
    <!-- 폼 변환 요청 입력 영역 -->
    <div class="bg-white rounded-xl shadow-sm border border-slate-200 p-4">
        <div class="flex items-center gap-2 mb-4">
            <i class="fas fa-file-import text-indigo-600"></i>
            <h2 class="text-lg font-bold text-slate-700">폼 변환 요청</h2>
        </div>

        <!-- 기본 정보 -->
        <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4 mb-4">
            <div class="lg:col-span-2">
                <label class="block text-xs font-bold text-slate-500 mb-1" for="newFormLink">폼 링크 <span class="text-red-500">*</span></label>
                <input type="url" id="newFormLink" placeholder="https://docs.google.com/forms/d/.../edit" required
                       class="w-full border border-slate-300 rounded px-3 py-2 text-sm focus:border-indigo-500 outline-none">
            </div>
            <div>
                <label class="block text-xs font-bold text-slate-500 mb-1" for="newRequesterEmail">신청자 이메일 <span class="text-red-500">*</span></label>
                <input type="email" id="newRequesterEmail" placeholder="example@email.com" required
                       class="w-full border border-slate-300 rounded px-3 py-2 text-sm focus:border-indigo-500 outline-none">
            </div>
        </div>

        <!-- 세그먼트 및 가격 (surveyForm) -->
        <div class="border border-slate-100 rounded-lg p-3 mb-4">
            <p class="text-xs font-bold text-slate-400 mb-3">세그먼트 및 가격</p>
            <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-4 mb-4">
                <div>
                    <label class="block text-xs font-bold text-slate-500 mb-1" for="newDeadline">마감일</label>
                    <input type="date" id="newDeadline" required
                           class="w-full border border-slate-300 rounded px-3 py-2 text-sm focus:border-indigo-500 outline-none">
                </div>
                <div>
                    <label class="block text-xs font-bold text-slate-500 mb-1" for="newGender">성별</label>
                    <select id="newGender" class="w-full border border-slate-300 rounded px-3 py-2 text-sm focus:border-indigo-500 outline-none">
                        <option value="ALL">전체</option>
                        <option value="MALE">남성</option>
                        <option value="FEMALE">여성</option>
                    </select>
                </div>
                <div>
                    <label class="block text-xs font-bold text-slate-500 mb-1" for="newDueCount">목표 응답 수</label>
                    <input type="number" id="newDueCount" placeholder="예: 100" min="1" required
                           class="w-full border border-slate-300 rounded px-3 py-2 text-sm focus:border-indigo-500 outline-none">
                </div>
                <div>
                    <label class="block text-xs font-bold text-slate-500 mb-1" for="newTotalCoin">총 코인</label>
                    <input type="number" id="newTotalCoin" placeholder="예: 10000" min="0" required
                           class="w-full border border-slate-300 rounded px-3 py-2 text-sm focus:border-indigo-500 outline-none">
                </div>
            </div>
            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                <!-- 연령대 -->
                <div>
                    <label class="block text-xs font-bold text-slate-500 mb-2">연령대 <span class="text-red-500">*</span></label>
                    <div class="flex flex-wrap gap-2">
                        <label class="flex items-center gap-1 text-xs cursor-pointer">
                            <input type="checkbox" value="ALL" class="new-age-checkbox" onchange="handleAgeAllToggle(this)"> 전체
                        </label>
                        <label class="flex items-center gap-1 text-xs cursor-pointer"><input type="checkbox" value="TEN" class="new-age-checkbox new-age-specific"> 10대</label>
                        <label class="flex items-center gap-1 text-xs cursor-pointer"><input type="checkbox" value="TWENTY" class="new-age-checkbox new-age-specific"> 20대</label>
                        <label class="flex items-center gap-1 text-xs cursor-pointer"><input type="checkbox" value="THIRTY" class="new-age-checkbox new-age-specific"> 30대</label>
                        <label class="flex items-center gap-1 text-xs cursor-pointer"><input type="checkbox" value="FOURTY" class="new-age-checkbox new-age-specific"> 40대</label>
                        <label class="flex items-center gap-1 text-xs cursor-pointer"><input type="checkbox" value="FIFTY" class="new-age-checkbox new-age-specific"> 50대</label>
                        <label class="flex items-center gap-1 text-xs cursor-pointer"><input type="checkbox" value="SIXTY" class="new-age-checkbox new-age-specific"> 60대</label>
                        <label class="flex items-center gap-1 text-xs cursor-pointer"><input type="checkbox" value="OVER" class="new-age-checkbox new-age-specific"> 70세+</label>
                    </div>
                </div>
                <!-- 거주지 -->
                <div>
                    <label class="block text-xs font-bold text-slate-500 mb-2">거주지 <span class="text-red-500">*</span></label>
                    <div class="flex flex-wrap gap-2">
                        <label class="flex items-center gap-1 text-xs cursor-pointer">
                            <input type="checkbox" value="ALL" class="new-residence-checkbox" onchange="handleResidenceAllToggle(this)"> 전체
                        </label>
                        <label class="flex items-center gap-1 text-xs cursor-pointer"><input type="checkbox" value="SEOUL" class="new-residence-checkbox new-residence-specific"> 서울</label>
                        <label class="flex items-center gap-1 text-xs cursor-pointer"><input type="checkbox" value="GYEONGGI" class="new-residence-checkbox new-residence-specific"> 경기</label>
                        <label class="flex items-center gap-1 text-xs cursor-pointer"><input type="checkbox" value="INCHEON" class="new-residence-checkbox new-residence-specific"> 인천</label>
                        <label class="flex items-center gap-1 text-xs cursor-pointer"><input type="checkbox" value="BUSAN" class="new-residence-checkbox new-residence-specific"> 부산</label>
                        <label class="flex items-center gap-1 text-xs cursor-pointer"><input type="checkbox" value="DAEGU" class="new-residence-checkbox new-residence-specific"> 대구</label>
                        <label class="flex items-center gap-1 text-xs cursor-pointer"><input type="checkbox" value="DAEJEON" class="new-residence-checkbox new-residence-specific"> 대전</label>
                        <label class="flex items-center gap-1 text-xs cursor-pointer"><input type="checkbox" value="GWANGJU" class="new-residence-checkbox new-residence-specific"> 광주</label>
                        <label class="flex items-center gap-1 text-xs cursor-pointer"><input type="checkbox" value="ULSAN" class="new-residence-checkbox new-residence-specific"> 울산</label>
                        <label class="flex items-center gap-1 text-xs cursor-pointer"><input type="checkbox" value="SEJONG" class="new-residence-checkbox new-residence-specific"> 세종</label>
                        <label class="flex items-center gap-1 text-xs cursor-pointer"><input type="checkbox" value="GANGWON" class="new-residence-checkbox new-residence-specific"> 강원</label>
                        <label class="flex items-center gap-1 text-xs cursor-pointer"><input type="checkbox" value="CHUNGBUK" class="new-residence-checkbox new-residence-specific"> 충북</label>
                        <label class="flex items-center gap-1 text-xs cursor-pointer"><input type="checkbox" value="CHUNGNAM" class="new-residence-checkbox new-residence-specific"> 충남</label>
                        <label class="flex items-center gap-1 text-xs cursor-pointer"><input type="checkbox" value="JEONBUK" class="new-residence-checkbox new-residence-specific"> 전북</label>
                        <label class="flex items-center gap-1 text-xs cursor-pointer"><input type="checkbox" value="JEONNAM" class="new-residence-checkbox new-residence-specific"> 전남</label>
                        <label class="flex items-center gap-1 text-xs cursor-pointer"><input type="checkbox" value="GYEONGBUK" class="new-residence-checkbox new-residence-specific"> 경북</label>
                        <label class="flex items-center gap-1 text-xs cursor-pointer"><input type="checkbox" value="GYEONGNAM" class="new-residence-checkbox new-residence-specific"> 경남</label>
                        <label class="flex items-center gap-1 text-xs cursor-pointer"><input type="checkbox" value="JEJU" class="new-residence-checkbox new-residence-specific"> 제주</label>
                    </div>
                </div>
            </div>
        </div>

        <!-- 스크리닝 -->
        <div class="border border-slate-100 rounded-lg p-3 mb-4">
            <p class="text-xs font-bold text-slate-400 mb-3">스크리닝 (선택)</p>
            <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
                <div class="md:col-span-2">
                    <label class="block text-xs font-bold text-slate-500 mb-1" for="newScreeningContent">스크리닝 문항 내용</label>
                    <input type="text" id="newScreeningContent" placeholder="예: 최근 6개월 내 온라인 쇼핑 경험이 있으신가요?"
                           class="w-full border border-slate-300 rounded px-3 py-2 text-sm focus:border-indigo-500 outline-none">
                </div>
                <div>
                    <label class="block text-xs font-bold text-slate-500 mb-1" for="newScreeningAnswer">정답</label>
                    <select id="newScreeningAnswer" class="w-full border border-slate-300 rounded px-3 py-2 text-sm focus:border-indigo-500 outline-none">
                        <option value="">없음</option>
                        <option value="true">예 (true)</option>
                        <option value="false">아니오 (false)</option>
                    </select>
                </div>
            </div>
            <p class="mt-2 text-xs text-slate-400">※ 마감일, 목표 응답 수, 총 코인, 연령대, 거주지는 필수 입력입니다.</p>
        </div>

        <!-- 관심사 -->
        <div class="border border-slate-100 rounded-lg p-3 mb-4">
            <p class="text-xs font-bold text-slate-400 mb-3">관심사 <span class="text-red-500">*</span></p>
            <div class="flex flex-wrap gap-2">
                <label class="flex items-center gap-1 text-xs cursor-pointer"><input type="checkbox" value="CAREER" class="new-interest-checkbox"> 직장/커리어</label>
                <label class="flex items-center gap-1 text-xs cursor-pointer"><input type="checkbox" value="BUSINESS" class="new-interest-checkbox"> 창업/사업</label>
                <label class="flex items-center gap-1 text-xs cursor-pointer"><input type="checkbox" value="FINANCE" class="new-interest-checkbox"> 재테크/금융</label>
                <label class="flex items-center gap-1 text-xs cursor-pointer"><input type="checkbox" value="HEALTH" class="new-interest-checkbox"> 건강/운동</label>
                <label class="flex items-center gap-1 text-xs cursor-pointer"><input type="checkbox" value="CULTURE" class="new-interest-checkbox"> 문화/여가</label>
                <label class="flex items-center gap-1 text-xs cursor-pointer"><input type="checkbox" value="FASHION" class="new-interest-checkbox"> 패션/뷰티</label>
                <label class="flex items-center gap-1 text-xs cursor-pointer"><input type="checkbox" value="SOCIETY" class="new-interest-checkbox"> 사회/정치</label>
                <label class="flex items-center gap-1 text-xs cursor-pointer"><input type="checkbox" value="SELF_IMPROVEMENT" class="new-interest-checkbox"> 자기계발</label>
                <label class="flex items-center gap-1 text-xs cursor-pointer"><input type="checkbox" value="DAILY_LIFE" class="new-interest-checkbox"> 일상생활</label>
            </div>
        </div>

        <!-- 유효성 검사 결과 -->
        <div id="validationResultContainer" class="border border-green-200 bg-green-50 rounded-lg p-3 mb-4 hidden">
            <div class="flex items-start gap-2">
                <i class="fas fa-check-circle text-green-600 mt-0.5"></i>
                <div class="flex-1">
                    <p class="text-xs font-bold text-green-700 mb-1">유효성 검사 완료</p>
                    <p id="validationResultText" class="text-xs text-green-600"></p>
                </div>
            </div>
        </div>

        <!-- 유효성 검사 결과 -->
        <div id="validationFailureContainer" class="border border-red-200 bg-red-50 rounded-lg p-3 mb-4 hidden">
            <div class="flex items-start gap-2">
                <i class="fas fa-check-circle text-red-600 mt-0.5"></i>
                <div class="flex-1">
                    <p class="text-xs font-bold text-red-700 mb-1">유효성 검사 실패</p>
                    <p id="validationFailureText" class="text-xs text-red-600"></p>
                </div>
            </div>
        </div>

        <!-- 버튼 -->
        <div class="flex justify-end gap-2">
            <button id="validationButton" onclick="validateFormLink()" class="px-6 py-2 bg-indigo-600 text-white rounded text-sm font-bold hover:bg-indigo-700 transition inline-flex items-center justify-center">
                <i id="validationButtonIcon" class="fas fa-check-circle mr-1"></i>
                <span id="validationButtonText">유효성 검사</span>
            </button>
            <button onclick="submitFormRequest()" class="px-6 py-2 bg-green-600 text-white rounded text-sm font-bold hover:bg-green-700 transition">
                <i class="fas fa-paper-plane mr-1"></i>변환 요청
            </button>
        </div>
    </div>

    <!-- 검색 및 필터 영역 -->
    <div class="bg-white rounded-xl shadow-sm border border-slate-200 p-4">
        <div class="flex flex-wrap gap-4 items-end">
            <!-- 이메일 검색 -->
            <div class="flex-1 min-w-[200px]">
                <label class="block text-xs font-bold text-slate-500 mb-1" for="searchEmail">신청자 이메일 검색</label>
                <input type="text" id="searchEmail" placeholder="이메일 입력..."
                       class="w-full border border-slate-300 rounded px-3 py-2 text-sm focus:border-indigo-500 outline-none"
                       onkeyup="if(event.key === 'Enter') loadFormRequests()">
            </div>
            <!-- 등록 상태 필터 -->
            <div class="min-w-[150px]">
                <label class="block text-xs font-bold text-slate-500 mb-1" for="filterStatus">등록 상태</label>
                <select id="filterStatus" class="w-full border border-slate-300 rounded px-3 py-2 text-sm focus:border-indigo-500 outline-none" onchange="loadFormRequests()">
                    <option value="">전체</option>
                    <option value="false">미등록</option>
                    <option value="true">등록완료</option>
                </select>
            </div>
            <!-- 페이지 크기 -->
            <div class="min-w-[100px]">
                <label class="block text-xs font-bold text-slate-500 mb-1" for="pageSize">표시 개수</label>
                <select id="pageSize" class="w-full border border-slate-300 rounded px-3 py-2 text-sm focus:border-indigo-500 outline-none" onchange="loadFormRequests()">
                    <option value="10">10개</option>
                    <option value="20">20개</option>
                    <option value="50">50개</option>
                </select>
            </div>
            <!-- 버튼 영역 -->
            <div class="flex gap-2">
                <button onclick="loadFormRequests()" class="px-4 py-2 bg-indigo-600 text-white rounded text-sm font-bold hover:bg-indigo-700">
                    <i class="fas fa-search mr-1"></i>검색
                </button>
                <button onclick="resetFilters()" class="px-4 py-2 bg-slate-500 text-white rounded text-sm font-bold hover:bg-slate-600">
                    <i class="fas fa-undo mr-1"></i>초기화
                </button>
            </div>
        </div>
    </div>

    <!-- 테이블 -->
    <div class="bg-white rounded-xl shadow-sm border border-slate-200 overflow-hidden">
        <table class="w-full text-sm text-left">
            <thead class="bg-slate-50 text-slate-500 border-b">
            <tr>
                <th class="px-6 py-4">ID</th>
                <th class="px-6 py-4">폼 링크</th>
                <th class="px-6 py-4">신청자 이메일</th>
                <th class="px-6 py-4">설문 ID</th>
                <th class="px-6 py-4">질문 수</th>
                <th class="px-6 py-4">목표 응답</th>
                <th class="px-6 py-4">가격</th>
                <th class="px-6 py-4">등록 상태</th>
                <th class="px-6 py-4">등록일</th>
                <th class="px-6 py-4 text-center">작업</th>
            </tr>
            </thead>
            <tbody id="formRequestTableBody" class="divide-y divide-slate-100">
                <!-- 동적으로 로드됨 -->
            </tbody>
        </table>
    </div>

    <!-- 페이지네이션 -->
    <div id="paginationContainer" class="flex justify-between items-center">
        <div id="pageInfo" class="text-sm text-slate-600"></div>
        <div id="pagination" class="flex gap-1"></div>
    </div>
</div>

<!-- 토스트 컨테이너 -->
<div id="toastContainer"></div>

<!-- 설문 생성 모달 -->
<div id="surveyCreateModal" class="hidden fixed inset-0 bg-black bg-opacity-50 z-50 flex items-center justify-center">
    <div class="bg-white rounded-xl shadow-2xl w-full max-w-lg mx-4 overflow-hidden">
        <div class="bg-indigo-600 px-6 py-4">
            <h3 class="text-lg font-bold text-white"><i class="fas fa-plus-circle mr-2"></i>설문 생성</h3>
        </div>
        <div class="p-6 space-y-4">
            <div id="modalFormInfo" class="bg-slate-50 rounded-lg p-4 text-sm">
                <p class="text-slate-500 mb-1">폼 링크</p>
                <a id="modalFormLink" href="#" target="_blank" class="text-indigo-600 hover:underline break-all"></a>
            </div>
            <div>
                <label class="block text-sm font-bold text-slate-700 mb-2" for="modalSurveyTitle">설문 제목 <span class="text-red-500">*</span></label>
                <input type="text" id="modalSurveyTitle" class="w-full border border-slate-300 rounded-lg px-4 py-3 text-sm focus:border-indigo-500 focus:ring-2 focus:ring-indigo-200 outline-none transition" placeholder="설문 제목을 입력하세요">
            </div>
            <div>
                <label class="block text-sm font-bold text-slate-700 mb-2" for="modalSurveyDescription">설문 설명</label>
                <textarea id="modalSurveyDescription" class="w-full border border-slate-300 rounded-lg px-4 py-3 text-sm focus:border-indigo-500 focus:ring-2 focus:ring-indigo-200 outline-none transition resize-none" rows="3" placeholder="설문 설명을 입력하세요 (선택사항)"></textarea>
            </div>
            <input type="hidden" id="modalFormRequestId">
        </div>
        <div class="bg-slate-50 px-6 py-4 flex justify-end gap-3">
            <button onclick="closeSurveyModal()" class="px-4 py-2 text-sm text-slate-600 hover:bg-slate-200 rounded-lg transition">취소</button>
            <button onclick="submitCreateSurvey()" class="px-6 py-2 text-sm bg-indigo-600 text-white font-bold rounded-lg hover:bg-indigo-700 transition">
                <i class="fas fa-check mr-1"></i>설문 생성 및 등록
            </button>
        </div>
    </div>
</div>

<script th:src="@{/bo/scripts/form-request.js}"></script>
</body>
</html>
